name: Release

# Publishing is triggered by pushing a version tag, so the released artifact always
# corresponds to a specific commit that is in the repository. Nothing publishes from a
# working tree.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and verify without publishing"
        type: boolean
        default: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm trusted publishing (OIDC), which removes the need to store a
      # long-lived token. Note that OIDC cannot perform a package's *first* publish —
      # npm will not let you register a trusted publisher until the package exists — so
      # the initial release runs on an NPM_TOKEN secret and the secret can be deleted
      # once trusted publishing is configured.
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm 11.5.1+, which is newer than the version bundled
      # with the Node 20 runner image.
      - name: Use an npm that supports trusted publishing
        run: npm install -g npm@latest

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      # The tag is the release's claim about what version this is. If it disagrees with
      # package.json, one of the two is wrong and publishing either would be a lie.
      - name: Verify the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p 'require("./package.json").version')"
          SRC="$(node -e 'import("./src/version.js").then(m => console.log(m.VERSION))')"
          echo "tag=$TAG package.json=$PKG src/version.js=$SRC"
          test "$TAG" = "$PKG" || { echo "::error::tag v$TAG does not match package.json $PKG"; exit 1; }
          test "$TAG" = "$SRC" || { echo "::error::tag v$TAG does not match src/version.js $SRC"; exit 1; }

      # Catches the failure mode a dry run cannot: a package that resolves and installs
      # but does not actually run once unpacked somewhere else.
      - name: Install the tarball and run the binary
        run: |
          npm pack --ignore-scripts
          mkdir -p /tmp/installcheck && cd /tmp/installcheck
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE"/lapointelabs-tripwire-*.tgz
          ./node_modules/.bin/tripwire --version
          ./node_modules/.bin/tripwire engines --no-color
          ./node_modules/.bin/tripwire rules --json > /dev/null
          ./node_modules/.bin/tripwire scan . --no-ai --no-color

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true
        run: npm publish
        env:
          # Used when set, which is what the first publish requires. Once the package
          # exists and a trusted publisher is registered for this repo and workflow on
          # npmjs.com, delete the NPM_TOKEN secret and this resolves to empty — npm then
          # authenticates with the OIDC token from `id-token: write` above, and there is
          # no long-lived credential to leak or rotate.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish dry run
        if: "!startsWith(github.ref, 'refs/tags/v') || inputs.dry_run == true"
        run: npm publish --dry-run
