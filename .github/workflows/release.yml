name: Release

# Publishing is triggered by pushing a version tag, so the released artifact always
# corresponds to a specific commit that is in the repository. Nothing publishes from a
# working tree.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and verify without publishing"
        type: boolean
        default: true

jobs:
  # package.json claims `engines: node >=20.1`. Testing on one version would make that
  # claim untested — and the floor is the version most likely to break, since it is the
  # one nobody develops on.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22", "24"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - run: npm ci
      - run: npm test

      # Catches the failure mode a dry run cannot: a package that resolves and installs
      # but does not actually run once unpacked somewhere else.
      - name: Install the tarball and run the binary
        run: |
          npm pack --ignore-scripts
          mkdir -p /tmp/installcheck && cd /tmp/installcheck
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE"/lapointelabs-tripwire-*.tgz
          ./node_modules/.bin/tripwire --version
          ./node_modules/.bin/tripwire engines --no-color
          ./node_modules/.bin/tripwire rules --json > /dev/null
          ./node_modules/.bin/tripwire scan . --no-ai --no-color

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm trusted publishing (OIDC). Note that OIDC cannot perform a
      # package's *first* publish — npm will not register a trusted publisher until the
      # package exists — so v0.1.0 was published locally and everything after it runs here.
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm 11.5.1+, newer than the npm bundled with Node 20.
      #
      # Pinned to the 11.x line rather than @latest on purpose: npm 12 requires Node
      # ^22.22 || ^24.15 || >=26, so `npm install -g npm@latest` started failing here the
      # moment npm 12 shipped. A floating major on a fixed Node is a build that breaks on
      # someone else's release schedule.
      - name: Install an npm that supports trusted publishing
        run: |
          npm install -g "npm@^11"
          echo "npm $(npm --version) on node $(node --version)"

      # The pin above can still resolve to something too old if npm ever yanks releases,
      # and OIDC failing at publish time is the worst moment to find that out.
      - name: Verify npm supports trusted publishing
        run: |
          V="$(npm --version)"
          node -e '
            const v = process.argv[1].split(".").map(Number);
            const ok = v[0] > 11 || (v[0] === 11 && (v[1] > 5 || (v[1] === 5 && v[2] >= 1)));
            if (!ok) { console.error(`::error::npm ${process.argv[1]} is below the 11.5.1 required for trusted publishing`); process.exit(1); }
            console.log(`npm ${process.argv[1]} supports trusted publishing`);
          ' "$V"

      - run: npm ci

      # The tag is the release's claim about what version this is. If it disagrees with
      # package.json, one of the two is wrong and publishing either would be a lie.
      - name: Verify the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p 'require("./package.json").version')"
          SRC="$(node -e 'import("./src/version.js").then(m => console.log(m.VERSION))')"
          echo "tag=$TAG package.json=$PKG src/version.js=$SRC"
          test "$TAG" = "$PKG" || { echo "::error::tag v$TAG does not match package.json $PKG"; exit 1; }
          test "$TAG" = "$SRC" || { echo "::error::tag v$TAG does not match src/version.js $SRC"; exit 1; }

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true
        # No NODE_AUTH_TOKEN. Authentication is the OIDC token from `id-token: write`
        # above, exchanged with the registry for a short-lived publish credential. There
        # is no long-lived secret in this repository to leak or rotate.
        run: npm publish

      - name: Publish dry run
        if: "!startsWith(github.ref, 'refs/tags/v') || inputs.dry_run == true"
        run: |
          npm publish --dry-run
          echo "::notice::Dry run only — this does not exercise OIDC authentication. The first tag push is the real test."
