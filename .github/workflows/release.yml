name: Release

# Pushing a version tag publishes to npm. A manual run re-runs verification only.
# Publishing is unreachable from anything but a tag push, so the released artifact always
# corresponds to a commit that exists in the repository.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Least privilege: jobs start with no token scopes and grant only what they need.
permissions: {}

# A re-run must not race the original. Releases are never cancelled mid-flight.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # package.json claims `engines: node >=20.1`. Testing one version leaves that claim
  # untested, and the floor is the version most likely to break — nobody develops on it.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22", "24"]

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm test

      # Catches the failure mode inspecting a tarball cannot: a package that resolves and
      # installs but does not actually run once unpacked somewhere else.
      - name: Install the packed tarball and run the binary
        run: |
          npm pack --ignore-scripts
          mkdir -p "$RUNNER_TEMP/installcheck"
          cd "$RUNNER_TEMP/installcheck"
          npm init -y > /dev/null
          npm install "$GITHUB_WORKSPACE"/lapointelabs-tripwire-*.tgz
          ./node_modules/.bin/tripwire --version
          ./node_modules/.bin/tripwire engines --no-color
          ./node_modules/.bin/tripwire rules --json > /dev/null
          ./node_modules/.bin/tripwire benchmark --json > /dev/null
          ./node_modules/.bin/tripwire scan . --no-ai --no-color

  publish:
    needs: test
    # The only push trigger is a version tag, so this is "a tag was pushed". A manual run
    # can never publish, including one dispatched against a tag ref.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # npm trusted publishing. The registry exchanges this OIDC identity token for a
      # short-lived credential, so there is no NODE_AUTH_TOKEN and no long-lived secret in
      # this repository to leak or rotate.
      #
      # OIDC cannot perform a package's *first* publish — npm will not register a trusted
      # publisher until the package exists — so v0.1.0 was published by hand.
      id-token: write

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Node 24 LTS bundles npm 11.17, above the 11.5.1 that trusted publishing requires.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # The tag and package.json are two separate claims about which version this is.
      # Publishing while they disagree ships one of them as a lie.
      - name: Verify the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p 'require("./package.json").version')"
          test "$tag" = "$pkg" ||
            { echo "::error::tag v$tag does not match package.json $pkg"; exit 1; }

      # Deliberately no `npm ci`: nothing here builds, and `files` ships only bin/ and
      # src/, so the one job holding a publish credential installs no third-party code.
      #
      # `--provenance` attaches a signed Sigstore attestation binding this tarball to this
      # workflow run and commit, so consumers can verify where it was built.
      #
      # npm applies the `latest` dist-tag unless told otherwise, including for
      # prereleases. Without the case below, tagging v0.2.0-rc.1 would serve a release
      # candidate to everyone running `npx @lapointelabs/tripwire`.
      - name: Publish
        run: |
          version="$(node -p 'require("./package.json").version')"
          case "$version" in
            *-*) tag=next ;;
            *)   tag=latest ;;
          esac
          echo "publishing $version under dist-tag $tag"
          npm publish --provenance --tag "$tag"
