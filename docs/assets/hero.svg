<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Tripwire security scanner</title>
  <desc id="desc">A Tripwire scan combines native rules and specialist security engines into one score, report, and agent-ready fix plan.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10182e"/>
      <stop offset="1" stop-color="#080c17"/>
    </linearGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6b4a"/>
      <stop offset="1" stop-color="#ffb36b"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".035"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000" flood-opacity=".34"/>
    </filter>
  </defs>

  <rect width="1200" height="440" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="440" rx="24" fill="url(#grid)"/>
  <circle cx="1170" cy="-10" r="260" fill="#3157a4" opacity=".16"/>
  <circle cx="20" cy="440" r="230" fill="#ff6b4a" opacity=".08"/>

  <g transform="translate(64 62)">
    <g transform="translate(0 2)">
      <path d="M0 18h27l8-11 12 23 9-12h30" fill="none" stroke="url(#wire)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="47" cy="30" r="4" fill="#ff6b4a"/>
    </g>
    <text x="104" y="29" fill="#a9b7d6" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" font-weight="700" letter-spacing="2.2">TRIPWIRE / AGENT SECURITY</text>

    <text x="0" y="112" fill="#f7f8fc" font-family="ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="48" font-weight="720" letter-spacing="-1.8">One scan. Honest coverage.</text>
    <text x="0" y="158" fill="#f7f8fc" font-family="ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="48" font-weight="720" letter-spacing="-1.8">A fix plan agents can use.</text>

    <text x="0" y="207" fill="#a9b7d6" font-family="ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18">Native checks, specialist engines, optional model triage, and</text>
    <text x="0" y="235" fill="#a9b7d6" font-family="ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18">explicit gaps—normalized into evidence your team can act on.</text>

    <g transform="translate(0 277)" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="700" letter-spacing=".7">
      <rect width="132" height="34" rx="17" fill="#17233e" stroke="#7ea6ff" stroke-opacity=".42"/>
      <text x="66" y="22" fill="#a9c1f6" text-anchor="middle">NATIVE RULES</text>
      <rect x="144" width="170" height="34" rx="17" fill="#17233e" stroke="#7ea6ff" stroke-opacity=".42"/>
      <text x="229" y="22" fill="#a9c1f6" text-anchor="middle">SPECIALIST ENGINES</text>
      <rect x="326" width="122" height="34" rx="17" fill="#332019" stroke="#ff8a67" stroke-opacity=".5"/>
      <text x="387" y="22" fill="#ffad91" text-anchor="middle">SARIF 2.1</text>
    </g>
  </g>

  <g transform="translate(730 42)" filter="url(#shadow)">
    <rect width="410" height="356" rx="18" fill="#0c1222" stroke="#fff" stroke-opacity=".11"/>
    <rect width="410" height="48" rx="18" fill="#151d31"/>
    <rect y="31" width="410" height="17" fill="#151d31"/>
    <circle cx="24" cy="24" r="5" fill="#ff6b6b"/>
    <circle cx="42" cy="24" r="5" fill="#ffca57"/>
    <circle cx="60" cy="24" r="5" fill="#63d392"/>
    <text x="205" y="29" text-anchor="middle" fill="#7584a5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11">tripwire — scan</text>

    <g transform="translate(24 78)" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
      <text x="0" y="0" fill="#8090b2" font-size="12">$</text>
      <text x="17" y="0" fill="#dbe4f8" font-size="12">tripwire scan --engines</text>
      <text x="0" y="38" fill="#7ea6ff" font-size="12">◆</text>
      <text x="20" y="38" fill="#dbe4f8" font-size="12">14 findings across 3 files</text>

      <rect x="0" y="62" width="91" height="26" rx="13" fill="#4a1f22"/>
      <text x="45.5" y="79" text-anchor="middle" fill="#ff9d98" font-size="11" font-weight="700">7 CRITICAL</text>
      <rect x="101" y="62" width="70" height="26" rx="13" fill="#43291c"/>
      <text x="136" y="79" text-anchor="middle" fill="#ffb185" font-size="11" font-weight="700">7 HIGH</text>

      <text x="0" y="126" fill="#ff8d73" font-size="12">▲</text>
      <text x="20" y="126" fill="#eef2fb" font-size="12">SQL interpolation</text>
      <text x="337" y="126" fill="#8090b2" font-size="11" text-anchor="end">2</text>
      <line x1="20" y1="139" x2="338" y2="139" stroke="#fff" stroke-opacity=".08"/>

      <text x="0" y="163" fill="#ff8d73" font-size="12">▲</text>
      <text x="20" y="163" fill="#eef2fb" font-size="12">Model output → shell</text>
      <text x="337" y="163" fill="#8090b2" font-size="11" text-anchor="end">1</text>
      <line x1="20" y1="176" x2="338" y2="176" stroke="#fff" stroke-opacity=".08"/>

      <text x="0" y="200" fill="#ff8d73" font-size="12">▲</text>
      <text x="20" y="200" fill="#eef2fb" font-size="12">Committed credential</text>
      <text x="337" y="200" fill="#8090b2" font-size="11" text-anchor="end">1</text>

      <rect x="0" y="229" width="362" height="1" fill="#fff" opacity=".09"/>
      <text x="0" y="258" fill="#63d392" font-size="12">✓</text>
      <text x="20" y="258" fill="#a9b7d6" font-size="12">FIX_PLAN.md</text>
      <text x="132" y="258" fill="#63d392" font-size="12">✓</text>
      <text x="152" y="258" fill="#a9b7d6" font-size="12">report.html</text>
      <text x="268" y="258" fill="#63d392" font-size="12">✓</text>
      <text x="288" y="258" fill="#a9b7d6" font-size="12">SARIF</text>
    </g>
  </g>
</svg>
